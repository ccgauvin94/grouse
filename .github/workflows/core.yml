# Core (Rust) test + lint.
#
# Version pinning (X-7): actions below are pinned to major tags (@v4/@v2). We
# have NOT SHA-pinned them: there is no Dependabot config here to maintain
# digests, and a stale pin is worse than a major tag that still gets compatible
# security fixes. The pinned rustc below, --locked builds and the release gate
# (gate.yml) are the compensating controls. See the toolchain note just below.
#
# RUST TOOLCHAIN PIN (X-7): CI runs 1.97.1 via dtolnay/rust-toolchain
# (toolchain: "1.97.1"), matching core/rust-toolchain.toml and the devcontainer
# (ARG RUST_VERSION=1.97.1). The toolchain is centralized so every contributor,
# this job, and the devcontainer resolve the same compiler. If it must move,
# bump rust-toolchain.toml and this input together and align the devcontainer.
name: Core

on:
  push:
    branches: [main]
  pull_request:


# Least privilege: the default token only needs to read the repo (CodeQL
# actions/missing-workflow-permissions).
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Assert the compiler
        run: |
          set -euo pipefail
          case "$(rustc --version)" in
            "rustc 1.97.1 "*) echo "rustc: $(rustc --version)" ;;
            *) echo "::error::expected rustc 1.97.1, got $(rustc --version)"; exit 1 ;;
          esac

      # Run from core/ so rustup resolves core/rust-toolchain.toml; a
      # --manifest-path invocation from the repo root uses the runner default.
      - name: Test
        working-directory: core
        run: cargo test --locked

      - name: Clippy
        working-directory: core
        run: cargo clippy --locked --all-targets -- -D warnings
