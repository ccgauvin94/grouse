# macOS spike — the SwiftUI client's binding proof.
#
# This exists because NOTHING ELSE IN CI can see clients/macos: the core is built on Linux,
# the desktop inside a KDE flatpak image, the app inside the Android image. The spike is the
# one artefact that answers "do the uniffi Swift bindings compile, link and run against this
# core on Darwin?" — and this job is the only place that question is asked automatically.
#
# It builds the HOST arch only (the runner is arm64): cross-building x86_64 doubles a long
# Rust build for a binary nobody runs here. `build.sh` without --host-only still produces the
# universal library for a real release.
name: macOS spike

on:
  push:
    branches: [main]
    paths:
      - 'clients/macos/**'
      - 'core/**'
      - '.github/workflows/macos.yml'
  pull_request:
    paths:
      - 'clients/macos/**'
      - 'core/**'
      - '.github/workflows/macos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: macos-14
    # A cold job is a full Rust dependency build (iroh, rustls, ring) plus bindgen and
    # SwiftPM. Measured nothing yet — this bound exists so a hung cargo does not hold a
    # runner for six hours.
    timeout-minutes: 45
    env:
      # The core's dependencies are the same crates the other jobs build; a cold macOS
      # build of iroh is the slow part.
      CARGO_NET_RETRY: '5'
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: macos-spike-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: macos-spike-

      # The CLI that matches the uniffi crate (0.32.x): the Kotlin bindings committed in
      # this repo were generated by 0.32.1, and a mismatched generator rewrites them.
      - name: uniffi-bindgen-swift
        run: |
          command -v uniffi-bindgen-swift || cargo install uniffi --features cli --locked

      - name: Build the spike (Rust → lipo → bindgen → SwiftPM)
        run: ./clients/macos/spike/build.sh --host-only

      # Compiling proves the bindings and the CLI; RUNNING proves the static library linked
      # and the module loaded. With no GROUSE_KEY the CLI validates its environment and
      # exits 2 before touching the network — which is exactly the smoke test wanted here.
      - name: The binary runs (and asks for a key)
        run: |
          set +e
          ./clients/macos/spike/.build/debug/grouse-spike > /tmp/spike.out 2>&1
          code=$?
          set -e
          cat /tmp/spike.out
          if [[ $code -ne 2 ]]; then
            echo "::error::expected exit 2 (missing GROUSE_KEY), got $code"
            exit 1
          fi
          grep -q "GROUSE_KEY is required" /tmp/spike.out
