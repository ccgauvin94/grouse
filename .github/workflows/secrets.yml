# Secrets scan (gitleaks).
#
# Version pinning (X-7): actions are pinned to major tags (@v4/@v2). See
# core.yml for the repo-wide pinning policy and the Rust toolchain note.
name: Secrets scan

on: [push, pull_request]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        # X-6: gitleaks runs with an explicit config (.gitleaks.toml) that
        # provides the allowlist mechanism for known non-secret values. It is
        # loaded via GITLEAKS_CONFIG (the gitleaks-action input surface is
        # env-vars, not a `with:` field). The config extends gitleaks' default
        # rules, so no default detection is lost, and the repo has no committed
        # secrets (audit X-10 affirmed) — this adds the mechanism, not a
        # behavior change.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
