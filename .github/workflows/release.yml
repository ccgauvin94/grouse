# Release: on a version tag (`v*`), build the signed Android APK and the desktop
# Flatpak bundle, then publish both as GitHub Release assets.
#
# Version pinning (X-7): actions are pinned to major tags (@v4/@v6/@v2), the
# accepted lock level here. See core.yml for the toolchain "dedrift" note.
#
# Android signing, in preference order:
#   1. A real release key: GROUSE_KEYSTORE_BASE64 (keystore, `base64 -w0 k.jks`)
#      + GROUSE_STORE_PASSWORD / GROUSE_KEY_ALIAS / GROUSE_KEY_PASSWORD.
#   2. GROUSE_DEBUG_KEYSTORE_B64 (a PERSISTED debug key) with the standard
#      android/androiddebugkey/android credentials — sideload-only, but the
#      APKs upgrade each other, unlike the runner-generated debug key.
#   3. Neither set: the runner's one-off generated debug key (APKs won't upgrade
#      each other; a warning is emitted).
#
# The Android job builds the COMMITTED native lib + uniffi bindings. After a
# core/ change, run `just android-libs` and commit the regenerated .so/bindings
# BEFORE tagging; this workflow does not regenerate them (matching android.yml).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The keystore is a file; carry it as base64 and materialize it where the
      # gradle build's GROUSE_KEYSTORE path expects it. Shell guards keep this a
      # no-op when the secret is unset — secrets are not reliable in `if:`.
      - name: Configure signing
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.GROUSE_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_B64: ${{ secrets.GROUSE_DEBUG_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.GROUSE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.GROUSE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.GROUSE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_KEYSTORE_B64:-}" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/grouse-release.jks"
            printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
            {
              echo "GROUSE_KEYSTORE=$KEYSTORE_PATH"
              echo "GROUSE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
              echo "GROUSE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
              echo "GROUSE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with the release keystore."
          elif [ -n "${DEBUG_KEYSTORE_B64:-}" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/grouse-debug.jks"
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
            {
              echo "GROUSE_KEYSTORE=$KEYSTORE_PATH"
              echo "GROUSE_STORE_PASSWORD=android"
              echo "GROUSE_KEY_ALIAS=androiddebugkey"
              echo "GROUSE_KEY_PASSWORD=android"
            } >> "$GITHUB_ENV"
            echo "::warning::Signing with the persisted DEBUG keystore — sideload-only."
          else
            echo "::warning::No keystore secret set; assembleRelease uses the runner's generated debug key."
          fi

      - name: Build release APK
        working-directory: clients/android
        run: ./gradlew --no-daemon assembleRelease -Pgrouse.versionName="${GITHUB_REF_NAME#v}"

      - name: Stage APK
        run: |
          mkdir -p dist
          cp clients/android/app/build/outputs/apk/release/*.apk dist/grouse-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  # Host-side components the flatpak SDK cannot build (KRunner plugin + the
  # dlopened grouse-core). Mirrors .github/workflows/flatpak.yml.
  desktop-host-components:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@v4

      - name: Build KRunner plugin
        run: |
          dnf install -y qt6-qtbase-devel extra-cmake-modules \
            kf6-krunner-devel kf6-kservice-devel kf6-ki18n-devel \
            kf6-kcoreaddons-devel
          cmake -S clients/desktop/krunner -B /tmp/krunner-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib64
          cmake --build /tmp/krunner-build -j"$(nproc)"
          mkdir -p clients/desktop/krunner-prebuild
          cp /tmp/krunner-build/krunner/kf6/krunner/grouserunner.so \
             clients/desktop/krunner-prebuild/grouserunner.so

      - name: Build grouse-core
        run: |
          dnf install -y rust cargo cmake gcc
          cargo build --release --manifest-path core/Cargo.toml -p grouse-core
          mkdir -p clients/desktop/grouse-core-prebuild
          cp core/target/release/libgrouse_core.so clients/desktop/grouse-core-prebuild/

      - uses: actions/upload-artifact@v4
        with:
          name: host-components
          path: |
            clients/desktop/krunner-prebuild/grouserunner.so
            clients/desktop/grouse-core-prebuild/libgrouse_core.so

  desktop:
    runs-on: ubuntu-latest
    needs: desktop-host-components
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: host-components
          path: clients/desktop

      # Versionless names so `releases/latest/download/<name>` stays stable and
      # the README can link straight at the current build.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: grouse-desktop.flatpak
          manifest-path: clients/desktop/id.gauvin.Grouse.json
          cache: true
          upload-artifact: false

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-flatpak
          path: grouse-desktop.flatpak
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [android, desktop]
    steps:
      # Only the shippable artifacts: the intermediate `host-components`
      # (.so files consumed by the desktop job) must not become release assets.
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: desktop-flatpak
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
