# Flatpak bundle build.
#
# Version pinning (X-7): actions below are pinned to major tags (@v4/@v6) and the
# two container images are pinned to named tags (fedora:44, ...kde-6.10). That is
# the accepted lock level here; for stricter supply-chain hardening, pin actions
# to full commit SHAs and the container images to immutable digests
# (sha256:…). See core.yml for the Rust toolchain "dedrift" note.
name: Flatpak

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Host-side components that cannot be built inside the flatpak SDK, handed to
  # the flatpak job as artifacts and staged into the manifest.
  host-components:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@v4

      # The KRunner plugin has no dev headers in the flathub-infra image and no
      # package manager to add them, so it is built against Fedora 44's KF6 (the
      # host range KRunner runs on); the app self-installs it on first run.
      - name: Build KRunner plugin
        run: |
          dnf install -y qt6-qtbase-devel extra-cmake-modules \
            kf6-krunner-devel kf6-kservice-devel kf6-ki18n-devel \
            kf6-kcoreaddons-devel
          cmake -S clients/desktop/krunner -B /tmp/krunner-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib64
          cmake --build /tmp/krunner-build -j"$(nproc)"
          mkdir -p clients/desktop/krunner-prebuild
          cp /tmp/krunner-build/krunner/kf6/krunner/grouserunner.so \
             clients/desktop/krunner-prebuild/grouserunner.so

      # The core the desktop dlopens (transport, session state machine, roam —
      # the whole thin-client engine). It is a workspace member, so this builds
      # the in-tree grouse-core crate.
      - name: Build grouse-core
        run: |
          dnf install -y rust cargo cmake gcc
          cargo build --release --manifest-path core/Cargo.toml -p grouse-core
          mkdir -p clients/desktop/grouse-core-prebuild
          cp core/target/release/libgrouse_core.so clients/desktop/grouse-core-prebuild/

      - uses: actions/upload-artifact@v4
        with:
          name: host-components
          path: |
            clients/desktop/krunner-prebuild/grouserunner.so
            clients/desktop/grouse-core-prebuild/libgrouse_core.so

  flatpak:
    runs-on: ubuntu-latest
    needs: host-components
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: host-components
          path: clients/desktop

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: grouse-desktop.flatpak
          manifest-path: clients/desktop/id.gauvin.Grouse.json
          cache: true
          upload-artifact: true
