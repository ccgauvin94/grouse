name: Flatpak

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Host-side components that cannot be built inside the flatpak SDK, handed to
  # the flatpak job as artifacts and staged into the manifest.
  host-components:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@v4

      # The KRunner plugin has no dev headers in the flathub-infra image and no
      # package manager to add them, so it is built against Fedora 44's KF6 (the
      # host range KRunner runs on); the app self-installs it on first run.
      - name: Build KRunner plugin
        run: |
          dnf install -y qt6-qtbase-devel extra-cmake-modules \
            kf6-krunner-devel kf6-kservice-devel kf6-ki18n-devel \
            kf6-kcoreaddons-devel
          cmake -S clients/desktop/krunner -B /tmp/krunner-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib64
          cmake --build /tmp/krunner-build -j"$(nproc)"
          mkdir -p clients/desktop/krunner-prebuild
          cp /tmp/krunner-build/krunner/kf6/krunner/grouserunner.so \
             clients/desktop/krunner-prebuild/grouserunner.so

      # The roam transport the desktop dlopens. It is a workspace member now, so
      # this builds the in-tree crate — it used to shallow-clone the standalone
      # repo at a pinned SHA (which a --depth 1 clone cannot even reach).
      - name: Build grouse-roam-core
        run: |
          dnf install -y rust cargo cmake gcc
          cargo build --release --manifest-path core/Cargo.toml -p grouse-roam-core
          mkdir -p clients/desktop/roam-prebuild
          cp core/target/release/libgrouse_roam_core.so clients/desktop/roam-prebuild/

      - uses: actions/upload-artifact@v4
        with:
          name: host-components
          path: |
            clients/desktop/krunner-prebuild/grouserunner.so
            clients/desktop/roam-prebuild/libgrouse_roam_core.so

  flatpak:
    runs-on: ubuntu-latest
    needs: host-components
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: host-components
          path: clients/desktop

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: grouse-desktop.flatpak
          manifest-path: clients/desktop/id.gauvin.Grouse.json
          cache: true
          upload-artifact: true
